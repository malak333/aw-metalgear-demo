name: Demo validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the website or initial repository scaffold
        shell: bash
        run: |
          if [ -f index.html ]; then
            test -f styles.css
            test -d tests
            test -n "$(find tests -name 'test*.py' -print -quit)"
            python -B -m unittest discover -s tests -v
          else
            test -f README.md
            test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 0
            echo 'Repository scaffold validated; website feature is not yet present.'
          fi
